<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gratitude">
<title>Three Good Things — Evening Reflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-1: #171a33;
    --sky-2: #2c2a52;
    --sky-3: #423a63;
    --paper: #faf6ec;
    --paper-edge: #efe8d8;
    --ink: #2b2438;
    --ink-soft: #6f6680;
    --gold: #e8a33d;
    --gold-soft: #f4c978;
    --rose: #e8927c;
    --rose-soft: #f7ded6;
    --green: #7a9b6e;
    --green-soft: #e4ede0;
    --star-off: rgba(255,255,255,0.18);
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% -10%, var(--sky-3), var(--sky-2) 45%, var(--sky-1) 100%);
    font-family: 'Inter', sans-serif;
    color: var(--ink);
  }

  #stars {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 48px 16px 64px;
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(244, 201, 120, 0.8);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 42px);
    color: #fbf5e8;
    text-align: center;
    margin: 0 0 4px;
    max-width: 480px;
    line-height: 1.15;
  }

  .subhead {
    color: rgba(255,255,255,0.55);
    font-size: 14px;
    text-align: center;
    margin-bottom: 18px;
  }

  /* ---------- Date navigator ---------- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .date-nav button {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: #fbf5e8;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease, opacity 0.2s ease;
  }
  .date-nav button:hover:not(:disabled) { background: rgba(255,255,255,0.14); }
  .date-nav button:disabled { opacity: 0.3; cursor: default; }

  .date-nav input[type="date"] {
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    color: #fbf5e8;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px;
    padding: 6px 10px;
    color-scheme: dark;
  }
  .date-nav input[type="date"]:focus {
    outline: none;
    border-color: var(--gold);
  }

  .today-jump {
    background: none;
    border: none;
    color: var(--gold-soft);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    margin-bottom: 24px;
    padding: 0;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    background: var(--paper);
    border-radius: 18px;
    padding: 32px 28px 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.55), 0 2px 0 var(--paper-edge) inset;
    margin-top: 8px;
  }

  .stars-row {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 22px;
  }

  .star {
    width: 26px;
    height: 26px;
    transition: transform 0.25s ease, filter 0.25s ease;
  }
  .star svg { width: 100%; height: 100%; display: block; }
  .star.filled { transform: scale(1.08); }
  .star.pulse { animation: pulse 1.6s ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.55; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .section-label {
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
    font-weight: 600;
    margin: 22px 0 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label:first-of-type { margin-top: 0; }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper-edge);
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-weight: 500;
    line-height: 1.35;
  }

  .field label .num {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--gold);
    font-weight: 600;
    flex-shrink: 0;
  }

  .field.tiny-win label .num {
    color: var(--green);
  }

  .field textarea {
    width: 100%;
    resize: none;
    border: 1.5px solid var(--paper-edge);
    background: #fffdf9;
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    line-height: 1.4;
    min-height: 46px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .field textarea:focus {
    outline: none;
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(232, 163, 61, 0.18);
  }

  .field.tiny-win textarea:focus {
    border-color: var(--green);
    box-shadow: 0 0 0 3px rgba(122, 155, 110, 0.18);
  }

  .field textarea::placeholder { color: #b9b1c4; }

  .save-btn {
    width: 100%;
    margin-top: 8px;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--ink);
    color: #fbf5e8;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.1s ease;
  }
  .save-btn:hover { background: #423a5c; }
  .save-btn:active { transform: scale(0.98); }
  .save-btn:disabled {
    background: #cfc8da;
    cursor: default;
  }

  .save-msg {
    text-align: center;
    font-size: 13px;
    color: #7a9b6e;
    margin-top: 10px;
    min-height: 16px;
    font-weight: 500;
  }

  .banner {
    width: 100%;
    max-width: 460px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--rose-soft);
    border: 1px solid rgba(232, 146, 124, 0.4);
    color: #8a4a3a;
    font-size: 13.5px;
    padding: 12px 16px;
    border-radius: 12px;
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .banner svg { flex-shrink: 0; width: 18px; height: 18px; }

  /* ---------- Quote card ---------- */
  .quote-card {
    width: 100%;
    max-width: 460px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 20px 22px;
    margin-top: 28px;
    text-align: center;
  }

  .quote-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-soft);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .quote-text {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 16px;
    line-height: 1.5;
    color: #fbf5e8;
    margin: 0 0 10px;
  }

  .quote-author {
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-bottom: 14px;
  }

  .quote-refresh {
    background: none;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.75);
    font-size: 12px;
    font-weight: 500;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .quote-refresh:hover { background: rgba(255,255,255,0.1); }

  .quote-source {
    display: block;
    margin-top: 10px;
    font-size: 10.5px;
    color: rgba(255,255,255,0.3);
  }
  .quote-source a { color: rgba(255,255,255,0.4); }

  .history {
    width: 100%;
    max-width: 460px;
    margin-top: 36px;
  }

  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 0 2px;
  }

  .history-title {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    color: #fbf5e8;
    font-weight: 500;
  }

  .streak {
    font-size: 12px;
    color: var(--gold-soft);
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .entry {
    background: rgba(250, 246, 236, 0.06);
    border: 1px solid rgba(250, 246, 236, 0.1);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .entry:hover {
    background: rgba(250, 246, 236, 0.1);
    border-color: rgba(250, 246, 236, 0.2);
  }
  .entry.active {
    border-color: var(--gold);
    background: rgba(232, 163, 61, 0.08);
  }

  .entry-date {
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.4);
    margin-bottom: 6px;
    font-weight: 600;
  }

  .entry ul {
    margin: 0;
    padding-left: 18px;
    color: rgba(255,255,255,0.82);
    font-size: 14px;
    line-height: 1.6;
  }

  .entry li.win-item {
    color: var(--gold-soft);
  }

  .empty-history {
    color: rgba(255,255,255,0.4);
    font-size: 13.5px;
    text-align: center;
    padding: 20px 0;
  }

  .loading {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    text-align: center;
    padding: 20px 0;
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="page">
  <div class="eyebrow">A moment before the day ends</div>
  <h1 class="headline" id="headline">Three good things</h1>
  <div class="subhead" id="dateLabel"></div>

  <div class="date-nav">
    <button id="prevDay" aria-label="Previous day" title="Previous day">‹</button>
    <input type="date" id="datePicker">
    <button id="nextDay" aria-label="Next day" title="Next day">›</button>
  </div>
  <button class="today-jump" id="todayJump" style="display:none;">Jump back to today</button>

  <div class="banner" id="banner" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8a4a3a" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L2.9 17.1a1.7 1.7 0 0 0 1.5 2.5h15.2a1.7 1.7 0 0 0 1.5-2.5L13.7 3.9a1.7 1.7 0 0 0-3.4 0z"/></svg>
    <span id="bannerText"></span>
  </div>

  <div class="card">
    <div class="stars-row" id="starsRow"></div>

    <div class="section-label">Gratitude</div>

    <div class="field">
      <label><span class="num">1</span> <span id="promptText0"></span></label>
      <textarea id="g0" rows="1" placeholder=""></textarea>
    </div>
    <div class="field">
      <label><span class="num">2</span> <span id="promptText1"></span></label>
      <textarea id="g1" rows="1" placeholder=""></textarea>
    </div>
    <div class="field">
      <label><span class="num">3</span> <span id="promptText2"></span></label>
      <textarea id="g2" rows="1" placeholder=""></textarea>
    </div>

    <div class="section-label">Progress</div>

    <div class="field tiny-win">
      <label><span class="num">＋</span> A tiny win toward the life you want</label>
      <textarea id="g3" rows="1" placeholder="One small step, however small…"></textarea>
    </div>

    <button class="save-btn" id="saveBtn">Save today's gratitude</button>
    <div class="save-msg" id="saveMsg"></div>
  </div>

  <div class="quote-card">
    <div class="quote-label">A little inspiration</div>
    <p class="quote-text" id="quoteText"></p>
    <div class="quote-author" id="quoteAuthor"></div>
    <button class="quote-refresh" id="quoteRefresh">Another quote</button>
    <span class="quote-source">From <a href="https://www.snhu.edu/about-us/newsroom/education/personal-growth-quotes" target="_blank" rel="noopener">SNHU's Personal Growth Quotes</a></span>
  </div>

  <div class="history">
    <div class="history-head">
      <div class="history-title">Past reflections</div>
      <div class="streak" id="streakLabel"></div>
    </div>
    <div id="historyList"><div class="loading">Loading your entries…</div></div>
  </div>
</div>

<script>
  // ---------- Starfield background ----------
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const count = Math.floor((canvas.width * canvas.height) / 9000);
    stars = Array.from({length: count}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.7,
      r: Math.random() * 1.3 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.015 + 0.005
    }));
  }
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function drawStars(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      const twinkle = reduceMotion ? 0.6 : 0.4 + 0.6 * Math.abs(Math.sin(s.phase + t * s.speed));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 250, 235, ${twinkle * 0.8})`;
      ctx.fill();
    }
    if (!reduceMotion) requestAnimationFrame(drawStars);
  }
  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(drawStars);

  // ---------- Date helpers ----------
  function keyFromDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function todayKey() {
    return keyFromDate(new Date());
  }
  function dateFromDateStr(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function formatDateLabel(dateStr) {
    const dt = dateFromDateStr(dateStr);
    return dt.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  }
  function addDays(dateStr, delta) {
    const dt = dateFromDateStr(dateStr);
    dt.setDate(dt.getDate() + delta);
    return keyFromDate(dt);
  }

  const TODAY_KEY = todayKey();
  let selectedDate = TODAY_KEY;

  // ---------- Rotating, specific gratitude prompts ----------
  const PROMPT_POOL = [
    { text: "What made your day a little better?", placeholder: "Name them something you did for yourself or others for you …" },
    { text: "What's one small moment today you'd like to live again?", placeholder: "A moment worth replaying…" },
    { text: "What was hard today that you're still, somehow, grateful for?", placeholder: "Something that stretched you…" },
    { text: "What's something you saw, heard, tasted, or felt today that you appreciated?", placeholder: "A sensory detail, however small…" },
    { text: "What's something that worked or existed today that you'd miss if it were gone?", placeholder: "Something easy to take for granted…" }
  ];

  function dayIndex(dateStr) {
    const dt = dateFromDateStr(dateStr);
    const epoch = new Date(2024, 0, 1);
    return Math.floor((dt - epoch) / 86400000);
  }

  function getPromptsForDate(dateStr) {
    const n = PROMPT_POOL.length;
    const start = ((dayIndex(dateStr) * 2) % n + n) % n;
    return [0, 1, 2].map(i => PROMPT_POOL[(start + i) % n]);
  }

  const promptTextEls = [document.getElementById('promptText0'), document.getElementById('promptText1'), document.getElementById('promptText2')];
  const gratitudeInputs = [document.getElementById('g0'), document.getElementById('g1'), document.getElementById('g2')];

  function applyPromptsForDate(dateStr) {
    const prompts = getPromptsForDate(dateStr);
    prompts.forEach((p, i) => {
      promptTextEls[i].textContent = p.text;
      gratitudeInputs[i].placeholder = p.placeholder;
    });
  }

  // ---------- Star indicator icons ----------
  const starsRow = document.getElementById('starsRow');
  function starSVG(filled) {
    return `<svg viewBox="0 0 24 24">
      <path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.7l-6.1 3.3 1.5-6.8L2.2 9.5l6.9-.7z"
        fill="${filled ? 'var(--gold)' : 'none'}"
        stroke="${filled ? 'var(--gold)' : 'var(--star-off)'}"
        stroke-width="1.6" stroke-linejoin="round"/>
    </svg>`;
  }
  const starEls = [0,1,2,3].map(i => {
    const div = document.createElement('div');
    div.className = 'star';
    div.dataset.idx = i;
    starsRow.appendChild(div);
    return div;
  });
  function renderStars(values) {
    starEls.forEach((el, i) => {
      const filled = !!(values[i] && values[i].trim());
      el.innerHTML = starSVG(filled);
      el.classList.toggle('filled', filled);
      el.classList.toggle('pulse', !filled);
    });
  }
  renderStars(['', '', '', '']);

  // ---------- Elements ----------
  const inputs = [document.getElementById('g0'), document.getElementById('g1'), document.getElementById('g2'), document.getElementById('g3')];
  const saveBtn = document.getElementById('saveBtn');
  const saveMsg = document.getElementById('saveMsg');
  const banner = document.getElementById('banner');
  const bannerText = document.getElementById('bannerText');
  const headline = document.getElementById('headline');
  const dateLabel = document.getElementById('dateLabel');
  const datePicker = document.getElementById('datePicker');
  const prevDayBtn = document.getElementById('prevDay');
  const nextDayBtn = document.getElementById('nextDay');
  const todayJumpBtn = document.getElementById('todayJump');

  datePicker.max = TODAY_KEY;
  datePicker.value = selectedDate;

  function currentValues() {
    return inputs.map(i => i.value);
  }

  function updateBanner(values, dateStr) {
    const filledCount = values.filter(v => v.trim()).length;
    const dayWord = dateStr === TODAY_KEY ? 'today' : 'this day';
    if (filledCount === 4) {
      banner.style.display = 'none';
    } else if (filledCount === 0) {
      banner.style.display = 'flex';
      bannerText.textContent = dateStr === TODAY_KEY
        ? "You haven't noted anything for today yet. Take a minute before the day slips away."
        : "Nothing noted for this day yet. Go ahead and fill it in from memory.";
    } else {
      banner.style.display = 'flex';
      bannerText.textContent = `You've noted ${filledCount} of 4 for ${dayWord}. A couple more, when you're ready.`;
    }
  }

  function updateHeaderForDate(dateStr) {
    if (dateStr === TODAY_KEY) {
      headline.textContent = 'Three good things';
      dateLabel.textContent = formatDateLabel(dateStr);
      todayJumpBtn.style.display = 'none';
      saveBtn.textContent = "Save today's gratitude";
    } else {
      headline.textContent = 'Looking back';
      dateLabel.textContent = formatDateLabel(dateStr);
      todayJumpBtn.style.display = 'inline-block';
      saveBtn.textContent = "Save this day's gratitude";
    }
    nextDayBtn.disabled = dateStr >= TODAY_KEY;
  }

  // ---------- Storage (persistent, per-user) ----------
  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function getEntry(dateStr) {
    try {
      const res = localStorage.getItem(`gratitude:${dateStr}`);
      if (res) {
        const data = JSON.parse(res);
        return data.items || ['', '', '', ''];
      }
    } catch (e) {
      // no entry for this date yet
    }
    return ['', '', '', ''];
  }

  async function trySetEntry(dateStr, values) {
    try {
      const payload = JSON.stringify({
        items: values,
        savedAt: new Date().toISOString()
      });
      localStorage.setItem(`gratitude:${dateStr}`, payload);
      return true;
    } catch (e) {
      throw new Error('Storage write failed: ' + e.message);
    }
  }

  async function setEntry(dateStr, values) {
    if (!window.localStorage) {
      throw new Error('localStorage is not available in this environment.');
    }
    try {
      return await trySetEntry(dateStr, values);
    } catch (firstErr) {
      await wait(600);
      try {
        return await trySetEntry(dateStr, values);
      } catch (secondErr) {
        const message = (secondErr && secondErr.message) || (firstErr && firstErr.message) || 'Unknown storage error.';
        throw new Error(message);
      }
    }
  }

  async function listEntryKeys() {
    try {
      return Object.keys(localStorage).filter(k => k.startsWith('gratitude:'));
    } catch (e) {
      return [];
    }
  }

  // ---------- History + streak ----------
  function computeStreak(dateStrs) {
    const set = new Set(dateStrs);
    let streak = 0;
    let cursor = new Date();
    while (true) {
      const key = keyFromDate(cursor);
      if (set.has(key)) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  let historyEntries = [];

  function highlightActiveHistoryEntry() {
    document.querySelectorAll('.entry').forEach(el => {
      el.classList.toggle('active', el.dataset.date === selectedDate);
    });
  }

  async function loadHistory() {
    const listEl = document.getElementById('historyList');
    const streakEl = document.getElementById('streakLabel');
    try {
      const keys = await listEntryKeys();
      keys.sort().reverse();

      if (keys.length === 0) {
        listEl.innerHTML = '<div class="empty-history">Your reflections will appear here once you save your first one.</div>';
        streakEl.textContent = '';
        historyEntries = [];
        return;
      }

      const entries = [];
      for (const key of keys.slice(0, 14)) {
        const dateStr = key.replace('gratitude:', '');
        const raw = await getEntry(dateStr);
        const gratitudeItems = raw.slice(0, 3).filter(v => v && v.trim());
        const winItem = (raw[3] || '').trim();
        entries.push({ dateStr, gratitudeItems, winItem });
      }
      historyEntries = entries;

      listEl.innerHTML = entries.map(e => `
        <div class="entry" data-date="${e.dateStr}">
          <div class="entry-date">${formatDateLabel(e.dateStr)}</div>
          <ul>
            ${e.gratitudeItems.map(i => `<li>${escapeHTML(i)}</li>`).join('')}
            ${e.winItem ? `<li class="win-item">＋ ${escapeHTML(e.winItem)}</li>` : ''}
          </ul>
        </div>`).join('') || '<div class="empty-history">No entries yet.</div>';

      listEl.querySelectorAll('.entry').forEach(el => {
        el.addEventListener('click', () => goToDate(el.dataset.date));
      });
      highlightActiveHistoryEntry();

      const dateStrs = keys.map(k => k.replace('gratitude:', ''));
      const streak = computeStreak(dateStrs);
      streakEl.textContent = streak > 0 ? `${streak} day${streak === 1 ? '' : 's'} in a row` : '';
    } catch (e) {
      listEl.innerHTML = '<div class="empty-history">Could not load past entries.</div>';
    }
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  }

  // ---------- Navigation & Page Loading ----------
  async function loadEntryForDate(dateStr) {
    selectedDate = dateStr;
    datePicker.value = dateStr;
    updateHeaderForDate(dateStr);
    applyPromptsForDate(dateStr);

    const values = await getEntry(dateStr);
    inputs.forEach((input, i) => {
      input.value = values[i] || '';
      autoGrow(input);
    });

    renderStars(values);
    updateBanner(values, dateStr);
    highlightActiveHistoryEntry();
  }

  function goToDate(dateStr) {
    loadEntryForDate(dateStr);
  }

  // ---------- Dynamic Input & Event Listeners ----------
  inputs.forEach(el => {
    el.addEventListener('input', () => {
      autoGrow(el);
      const vals = currentValues();
      renderStars(vals);
      updateBanner(vals, selectedDate);
    });
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveMsg.textContent = 'Saving...';
    try {
      await setEntry(selectedDate, currentValues());
      saveMsg.textContent = 'Saved successfully!';
      await loadHistory();
      setTimeout(() => { saveMsg.textContent = ''; }, 3000);
    } catch (err) {
      saveMsg.textContent = 'Error saving entry. Please try again.';
      console.error(err);
    } finally {
      saveBtn.disabled = false;
    }
  });

  prevDayBtn.addEventListener('click', () => {
    loadEntryForDate(addDays(selectedDate, -1));
  });

  nextDayBtn.addEventListener('click', () => {
    if (selectedDate < TODAY_KEY) {
      loadEntryForDate(addDays(selectedDate, 1));
    }
  });

  todayJumpBtn.addEventListener('click', () => {
    loadEntryForDate(TODAY_KEY);
  });

  datePicker.addEventListener('change', (e) => {
    if (e.target.value) {
      loadEntryForDate(e.target.value);
    }
  });

  // ---------- Inspirational quote ----------
  const LIFE_QUOTES = [
    { text: "Twenty years from now you will be more disappointed by the things that you didn't do than by the ones you did do. So throw off the bowlines. Sail away from the safe harbor. Catch the trade winds in your sails. Explore. Dream. Discover.", author: "Mark Twain" },
    { text: "We are products of our past, but we don't have to be prisoners of it.", author: "Rick Warren" },
    { text: "You can waste your lives drawing lines. Or you can live your life crossing them.", author: "Shonda Rhimes" },
    { text: "You are the one that possesses the keys to your being. You carry the passport to your own happiness.", author: "Diane von Furstenberg" },
    { text: "When you get into a tight place and everything goes against you… never give up then, for that is just the place and time that the tide will turn.", author: "Harriet Beecher Stowe" },
    { text: "Accept responsibility for your life. Know that it is you who will get you where you want to go, no one else.", author: "Les Brown" },
    { text: "Once we believe in ourselves, we can risk curiosity, wonder, spontaneous delight, or any experience that reveals the human spirit.", author: "e.e. cummings" },
    { text: "If you don't make the time to work on creating the life you want, you're eventually going to be forced to spend a lot of time dealing with a life you don't want.", author: "Kevin Ngo" },
    { text: "It is never too late to be who you might have been.", author: "George Eliot" },
    { text: "The way I see it, if you want the rainbow, you gotta put up with the rain.", author: "Dolly Parton" }
  ];

  const quoteText = document.getElementById('quoteText');
  const quoteAuthor = document.getElementById('quoteAuthor');
  const quoteRefresh = document.getElementById('quoteRefresh');
  let lastQuoteIdx = -1;

  function showRandomQuote() {
    let idx = Math.floor(Math.random() * LIFE_QUOTES.length);
    if (LIFE_QUOTES.length > 1 && idx === lastQuoteIdx) {
      idx = (idx + 1) % LIFE_QUOTES.length;
    }
    lastQuoteIdx = idx;
    const q = LIFE_QUOTES[idx];
    quoteText.textContent = `"${q.text}"`;
    quoteAuthor.textContent = `— ${q.author}`;
  }
  quoteRefresh.addEventListener('click', showRandomQuote);
  showRandomQuote();

  // ---------- Init ----------
  (async () => {
    await loadEntryForDate(selectedDate);
    await loadHistory();
  })();
</script>
</body>
</html>
