<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#171a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gratitude">
<title>Three Good Things — Evening Reflection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
  
<canvas id="stars"></canvas>

<!-- userlogin -->
<div id="authContainer" style="display:none;">
  <div class="auth-card">
    <h2 id="authTitle">Sign Up</h2>
    <form id="authForm">
      <input type="email" id="authEmail" placeholder="Email" required>
      <input type="password" id="authPassword" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p id="authToggle">Already have an account? <a href="#">Log in</a></p>
  </div>
</div>


<div class="page">
  <div class="eyebrow">A moment before the day ends</div>
  <h1 class="headline" id="headline">Three good things</h1>
  <div class="subhead" id="dateLabel"></div>

  <div class="date-nav">
    <button id="prevDay" aria-label="Previous day" title="Previous day">‹</button>
    <input type="date" id="datePicker">
    <button id="nextDay" aria-label="Next day" title="Next day">›</button>
  </div>
  <button class="today-jump" id="todayJump" style="display:none;">Jump back to today</button>

  <div class="banner" id="banner" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8a4a3a" stroke-width="2"><path d="M12 9v4M12 17h.01M10.3 3.9L2.9 17.1a1.7 1.7 0 0 0 1.5 2.5h15.2a1.7 1.7 0 0 0 1.5-2.5L13.7 3.9a1.7 1.7 0 0 0-3.4 0z"/></svg>
    <span id="bannerText"></span>
  </div>

  <div class="card">
    <div class="stars-row" id="starsRow"></div>

    <div class="section-label">Gratitude</div>

    <div class="field">
      <label><span class="num">1</span> <span id="promptText0"></span></label>
      <textarea id="g0" rows="1" placeholder=""></textarea>
    </div>
    <div class="field">
      <label><span class="num">2</span> <span id="promptText1"></span></label>
      <textarea id="g1" rows="1" placeholder=""></textarea>
    </div>
    <div class="field">
      <label><span class="num">3</span> <span id="promptText2"></span></label>
      <textarea id="g2" rows="1" placeholder=""></textarea>
    </div>

    <div class="section-label">Progress</div>

    <div class="field tiny-win">
      <label><span class="num">＋</span> A tiny win toward the life you want</label>
      <textarea id="g3" rows="1" placeholder="One small step, however small…"></textarea>
    </div>

    <button class="save-btn" id="saveBtn">Save today's gratitude</button>
    <div class="save-msg" id="saveMsg"></div>
  </div>

<script src="export.js"></script>

  <div class="quote-card">
    <div class="quote-label">A little inspiration</div>
    <p class="quote-text" id="quoteText"></p>
    <div class="quote-author" id="quoteAuthor"></div>
    <button class="quote-refresh" id="quoteRefresh">Another quote</button>
    <span class="quote-source">From <a href="https://www.snhu.edu/about-us/newsroom/education/personal-growth-quotes" target="_blank" rel="noopener">SNHU's Personal Growth Quotes</a></span>
  </div>

  <div class="jsonexport">
    <button id="export-btn" class="btn">Export saved data (JSON)</button></div>
    </div>
  <div class="history">
    <div class="history-head">
      <div class="history-title">Past reflections</div>
      <div class="streak" id="streakLabel"></div>
    </div>
    <div id="historyList"><div class="loading">Loading your entries…</div></div>
  </div>
</div>

<script src="app.js" defer></script>


</body>
</html>
